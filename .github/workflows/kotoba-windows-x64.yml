name: Build Kotoba Overlay for Windows x64

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
    paths:
      - "artifacts/kotoba-overlay/**"
      - "lib/api-client-react/**"
      - "lib/api-spec/**"
      - "lib/api-zod/**"
      - "lib/db/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/kotoba-windows-x64.yml"
      - "package.json"
      - "scripts/require-pnpm.cjs"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release versions match
        shell: pwsh
        run: |
          $config = Get-Content artifacts/kotoba-overlay/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = Get-Content artifacts/kotoba-overlay/src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($config.version -ne $cargoVersion) { throw "Tauri and Cargo versions must match." }
          if ($env:GITHUB_REF -like "refs/tags/*" -and $env:GITHUB_REF_NAME -ne "v$($config.version)") {
            throw "Release tag must match the installed Tauri version: v$($config.version)"
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: artifacts/kotoba-overlay/src-tauri -> target

      - name: Install NSIS
        run: choco install nsis --yes --no-progress

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release notes and GitHub-only update policy
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & pnpm --filter @workspace/kotoba-overlay run test:release-notes 2>&1
          $testExit = $LASTEXITCODE
          $output | Write-Output
          if ($testExit -ne 0) {
            $details = ($output | Out-String).Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Release notes checks::$details"
            exit $testExit
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          & pnpm --filter @workspace/kotoba-overlay run desktop:build:windows 2>&1 | Tee-Object -FilePath windows-build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $details = (Get-Content windows-build.log -Tail 60) -join "`n"
            $details = $details.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows build diagnostics::$details"
            exit $buildExit
          }

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-build-diagnostics
          path: windows-build.log
          if-no-files-found: ignore

      - name: Verify the app executable is 64-bit Windows
        shell: pwsh
        run: |
          $app = "artifacts/kotoba-overlay/src-tauri/target/x86_64-pc-windows-msvc/release/kotoba-overlay.exe"
          if (-not (Test-Path $app)) { throw "Tauri app executable was not produced." }
          $bytes = [System.IO.File]::ReadAllBytes($app)
          if ($bytes.Length -lt 256 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "App is not a valid Windows PE executable." }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) { throw "App has an invalid PE header." }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ("Expected x64 app machine type 0x8664; got 0x{0:X4}." -f $machine) }
          Write-Host ("Verified x64 app: {0} ({1:N1} MB)" -f $app, ($bytes.Length / 1MB))

      - name: Verify the NSIS installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem "artifacts/kotoba-overlay/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes.Length -lt 256 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Installer is not a valid Windows executable." }
          Write-Host ("Installer ready: {0} ({1:N1} MB)" -f $installer.FullName, ($installer.Length / 1MB))

      # Test the installed package, not the executable in the build directory.
      # This runner has no game or translation credentials: this is not a gameplay test.
      - name: Smoke test Windows installation and overlay
        timeout-minutes: 10
        shell: pwsh
        run: |
          # Windows PowerShell provides the desktop .NET UI Automation assemblies.
          & powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass `
            -File artifacts/kotoba-overlay/scripts/windows-smoke.ps1 `
            -BundleDirectory artifacts/kotoba-overlay/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis `
            -InstallDirectory "$env:RUNNER_TEMP\Kotoba Smoke Install" `
            -DiagnosticsDirectory "$env:RUNNER_TEMP/kotoba-smoke-diagnostics"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-diagnostics
          path: ${{ runner.temp }}/kotoba-smoke-diagnostics/smoke-result.json
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: kotoba-overlay-windows-x64-installer
          path: artifacts/kotoba-overlay/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: kotoba-overlay-windows-x64-portable
          path: artifacts/kotoba-overlay/src-tauri/target/x86_64-pc-windows-msvc/release/kotoba-overlay.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Windows downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-assets
          # GitHub normalizes spaces in release asset names. Rename before
          # hashing so the manifest matches the names players download.
          for file in *.exe; do
            normalized="${file// /.}"
            if [ "$file" != "$normalized" ]; then mv -- "$file" "$normalized"; fi
          done
          sha256sum *.exe > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" release-assets/*.exe \
            release-assets/SHA256SUMS.txt \
            --verify-tag \
            --title "Kotoba Overlay $GITHUB_REF_NAME" \
            --notes-file "artifacts/kotoba-overlay/releases/$GITHUB_REF_NAME.md" \
            --generate-notes
