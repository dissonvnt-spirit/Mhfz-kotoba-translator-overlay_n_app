openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: translation
    description: Game text translation operations
paths:
  /dialogue-archives:
    post:
      operationId: createDialogueArchive
      summary: Store a private compiled dialogue archive after explicit consent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DialogueArchiveInput"
      responses:
        "201":
          description: Archive saved; keep the recovery code private
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DialogueArchiveReceipt"
        "400":
          description: Invalid dialogue or missing consent
        "413":
          description: Archive exceeds one MiB
        "429":
          description: Upload rate limit exceeded
        "503":
          description: Archive storage unavailable
    get:
      operationId: retrieveDialogueArchive
      summary: Retrieve an archive using its private recovery code
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Compiled dialogue archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DialogueArchive"
        "401":
          description: Missing or malformed recovery code
        "404":
          description: Archive not found
        "503":
          description: Archive storage unavailable
    delete:
      operationId: deleteDialogueArchive
      summary: Permanently delete a server archive using its recovery code
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Archive deleted or already absent
        "401":
          description: Missing or malformed recovery code
        "503":
          description: Archive storage unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /translate:
    post:
      operationId: translateGameText
      tags: [translation]
      summary: Translate detected game text
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationInput"
      responses:
        "200":
          description: Translated game text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationResult"
        "400":
          description: Invalid translation request
        "401":
          description: Missing or invalid service token
        "429":
          description: Translation request rate limit reached
        "502":
          description: Translation provider error
        "503":
          description: Translation provider is not configured
  /cloud/translate:
    post:
      operationId: translatePublicGameText
      tags: [translation]
      summary: Optional developer-funded translation after player consent
      security: []
      parameters:
        - in: header
          name: X-Kotoba-Cloud-Consent
          required: true
          schema:
            type: string
            enum: ["yes"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslationInput"
      responses:
        "200":
          description: Translated game text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationResult"
        "400":
          description: Missing consent or invalid dialogue
        "429":
          description: Free cloud allowance reached
        "502":
          description: No provider output
        "503":
          description: Cloud provider or quota storage unavailable
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    DialogueLine:
      type: object
      additionalProperties: false
      required: [sourceText, translatedText, timestamp]
      properties:
        sourceText: { type: string, minLength: 1, maxLength: 4000 }
        translatedText: { type: string, minLength: 1, maxLength: 4000 }
        timestamp: { type: integer, minimum: 0, maximum: 8640000000000000 }
    DialogueArchiveInput:
      type: object
      additionalProperties: false
      required: [title, lines, consent]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        consent: { type: boolean, enum: [true] }
        lines:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/DialogueLine" }
    DialogueArchiveReceipt:
      type: object
      required: [recoveryCode, lineCount]
      properties:
        recoveryCode: { type: string }
        lineCount: { type: integer }
    DialogueArchive:
      type: object
      required: [title, lines, createdAt]
      properties:
        title: { type: string }
        createdAt: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/DialogueLine" }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TranslationInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - text
    TranslationResult:
      type: object
      properties:
        sourceText:
          type: string
        translatedText:
          type: string
      required:
        - sourceText
        - translatedText

